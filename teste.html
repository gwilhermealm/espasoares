<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
  .slider-container {
    max-width: 800px;
    margin: auto;
    position: relative;
  }

  .slider {
    display: flex;
    overflow-x: auto; /* Permite o scroll horizontal */
    scroll-snap-type: x mandatory; /* Força a imagem a "grudar" na tela */
    scroll-behavior: smooth; /* Faz o deslize suave ao clicar nos links */
    border-radius: 8px;
  }

  .slider img {
    flex: 0 0 100%; /* Cada imagem ocupa 100% da largura do container */
    scroll-snap-align: start; /* Alinha o início da imagem ao container */
    object-fit: cover;
  }

  /* Esconder a barra de rolagem (opcional) */
  .slider::-webkit-scrollbar {
    display: none;
  }

  /* Estilo simples para os botões de navegação */
  .slider-nav {
    display: flex;
    column-gap: 1rem;
    position: absolute;
    bottom: 1.25rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
  }

  .slider-nav a {
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 50%;
    background-color: #fff;
    opacity: 0.75;
    transition: opacity ease 250ms;
  }

  .slider-nav a:hover {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="slider-container">
  <div class="slider-nav">
    <a href="#img1"></a>
    <a href="#img2"></a>
    <a href="#img3"></a>
  </div>

  <div class="slider">
    <img id="img1" src="https://picsum.photos/id/10/800/400" alt="Imagem 1">
    <img id="img2" src="https://picsum.photos/id/20/800/400" alt="Imagem 2">
    <img id="img3" src="https://picsum.photos/id/30/800/400" alt="Imagem 3">
  </div>
</div>


</body>
</html>
